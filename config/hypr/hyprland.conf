# Game-specific rules for Detroit: Become Human
windowrulev2 = fullscreen, title:^(Detroit: Become Human)$
windowrulev2 = borderless, title:^(Detroit: Become Human)$
windowrulev2 = monitor, DP-1, title:^(Detroit: Become Human)$
windowrulev2 = fullscreen, class:^steam_app_1222140$
windowrulev2 = borderless, class:^steam_app_1222140$
windowrulev2 = monitor, DP-1, class:^steam_app_1222140$

# Steam client Big Picture Mode - force fullscreen on DP-1 (M28U)
# When launched via gamescope wrapper, Steam shows as 'gamescope' class
windowrulev2 = monitor, DP-1, class:^gamescope$
windowrulev2 = workspace, 1, class:^gamescope$