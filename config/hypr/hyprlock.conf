# hyprlock.conf — the lock screen: blurred wallpaper, date over a large clock,
# then avatar, name and one input in the lower half (composition after
# saneAspect's hyprlock video).
#
# Generated by ~/.local/bin/theme from ~/.config/themes/tokyonight/theme.conf.
# Do not edit: change the palette file and run `theme set tokyonight`.
# The background is a symlink the theme tool refreshes on every wallpaper
# change, so a theme switch moves this too.

$bg   = rgba(26, 27, 38, 1.0)
$fg   = rgba(200, 211, 245, 1.0)
$dim  = rgba(121, 131, 164, 1.0)
$edge = rgba(69, 76, 101, 1.0)
$blue = rgba(130, 170, 255, 1.0)
$red  = rgba(247, 118, 142, 1.0)
$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/maxii/.cache/hyprlock-wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    contrast = 0.9
    vibrancy = 0.15
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %d"
    color = $dim
    font_size = 20
    font_family = $font
    position = 0, -405
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = <span font_weight='light'>$TIME</span>
    color = $fg
    font_size = 112
    font_family = $font
    position = 0, -315
    halign = center
    valign = center
}

# avatar: an islandFill disc with the user's initial
shape {
    monitor =
    size = 96, 96
    color = rgba(26, 27, 38, 0.92)
    rounding = -1
    border_size = 0
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] printf '%s' "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = $fg
    font_size = 36
    font_family = $font
    position = 0, 240
    halign = center
    valign = center
}

# NAME
label {
    monitor =
    text = $USER
    color = $dim
    font_size = 15
    font_family = $font
    position = 0, 305
    halign = center
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1
    rounding = 10
    inner_color = rgba(26, 27, 38, 0.72)
    outer_color = $edge
    check_color = $blue
    fail_color = $red
    font_color = $fg
    font_family = $font
    placeholder_text = unlock
    fade_on_empty = false
    dots_size = 0.24
    dots_spacing = 0.3
    fail_text = <i>$FAIL</i>
    position = 0, 370
    halign = center
    valign = center
}
